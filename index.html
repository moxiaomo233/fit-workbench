<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#E8547C" />
    <!-- 入口页禁止缓存：带 hash 的 js/css 可长缓存，但 index.html 一旦被缓存，
         更新后浏览器仍会去加载旧文件名的旧包，手机上就会出现「改了但没生效」。 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>健身会员</title>
    <!-- PWA：没有 manifest / apple-touch-icon 时，手机把网页加到桌面只能用浏览器
         自动生成的灰底首字母图标，所以这几行是「桌面图标长什么样」的唯一依据 -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/icon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="健身会员" />
    <meta name="application-name" content="健身会员" />
    <script type="module" crossorigin src="/fit-workbench/assets/index-BVI38ohp.js"></script>
    <link rel="stylesheet" crossorigin href="/fit-workbench/assets/index-BtbnjBwk.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
